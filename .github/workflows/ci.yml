name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

  wasm:
    name: Build and verify wasm
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      EM_CACHE: ${{ github.workspace }}/.cache/emcache
      EMSDK_VERSION: 6.0.1
      FFMPEG_VERSION: n9.0.1
      FFMPEG_WASM_VERIFY_OUTPUT_DIR: .tmp/verify-proof
      LAME_REF: 2badea1974ae36cb8312afe99cff1e6b3b5decee
      LIBVPX_REF: v1.17.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            gawk \
            libtool \
            nasm \
            pkg-config \
            yasm

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/FFmpeg
            .cache/FFmpeg-browser
            .cache/lame
            .cache/libvpx
            .cache/emcache
          key: wasm-${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-${{ env.FFMPEG_VERSION }}-${{ env.LAME_REF }}-${{ env.LIBVPX_REF }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/build.ts') }}
          restore-keys: |
            wasm-${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-${{ env.FFMPEG_VERSION }}-
            wasm-${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Live E2E
        run: pnpm test:e2e

      - name: Audit wasm distribution
        run: |
          set -euo pipefail
          if find dist -type f -print0 | xargs -0 file | grep -E 'ELF|Mach-O|PE32|MS-DOS executable'; then
            echo "::error::Native executable found in dist/"
            exit 1
          fi

      - name: Playground E2E
        run: pnpm playground:e2e

      - name: Build static workbench
        run: pnpm docs:build:compiled

      - name: Static browser ffmpac E2E
        run: PLAYGROUND_E2E_STATIC=1 pnpm playground:e2e

      - name: Upload conversion proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-wasm-conversion-proof
          path: |
            .tmp/verify-proof
            .tmp/playground-e2e-server.png
            .tmp/playground-e2e-static.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-wasm-dist
          path: dist
          if-no-files-found: warn
          retention-days: 14
