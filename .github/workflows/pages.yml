name: Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "playground/**"
      - "scripts/build.ts"
      - "scripts/build-docs-site.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static workbench
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EM_CACHE: ${{ github.workspace }}/.cache/emcache
      FFMPEG_VERSION: n8.1.1
      LAME_REF: master
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ffmpeg \
            gawk \
            libtool \
            nasm \
            pkg-config \
            yasm

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 4.0.23
          actions-cache-folder: emsdk-cache

      - name: Restore build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .cache/FFmpeg
            .cache/FFmpeg-browser
            .cache/lame
            .cache/emcache
          key: pages-wasm-${{ runner.os }}-${{ env.FFMPEG_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/build.ts') }}
          restore-keys: |
            pages-wasm-${{ runner.os }}-${{ env.FFMPEG_VERSION }}-
            pages-wasm-${{ runner.os }}-

      - name: Build deployable site
        run: pnpm docs:build

      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist/docs-site --project-name ffmpeg-sh-site --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
