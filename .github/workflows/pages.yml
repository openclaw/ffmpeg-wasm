name: Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "playground/**"
      - "scripts/build.ts"
      - "scripts/build-docs-site.ts"
      - "scripts/sample-video.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static workbench
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EM_CACHE: ${{ github.workspace }}/.cache/emcache
      EMSDK_VERSION: 6.0.1
      FFMPEG_VERSION: n9.0.1
      LAME_REF: 2badea1974ae36cb8312afe99cff1e6b3b5decee
      LIBVPX_REF: v1.17.0
      HAS_CLOUDFLARE_DEPLOY: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.3.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            gawk \
            libtool \
            nasm \
            pkg-config \
            yasm

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/FFmpeg
            .cache/FFmpeg-browser
            .cache/lame
            .cache/libvpx
            .cache/emcache
          key: pages-wasm-${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-${{ env.FFMPEG_VERSION }}-${{ env.LAME_REF }}-${{ env.LIBVPX_REF }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/build.ts') }}
          restore-keys: |
            pages-wasm-${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-${{ env.FFMPEG_VERSION }}-
            pages-wasm-${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-

      - name: Build deployable site
        run: pnpm docs:build

      - name: Deploy to Cloudflare Pages
        if: ${{ env.HAS_CLOUDFLARE_DEPLOY == 'true' }}
        run: pnpm exec wrangler pages deploy dist/docs-site --project-name ffmpeg-sh-site --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Skip deploy without Cloudflare credentials
        if: ${{ env.HAS_CLOUDFLARE_DEPLOY != 'true' }}
        run: echo "Cloudflare Pages deploy skipped; set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets to enable deploys."
